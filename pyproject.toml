[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atengk-mcp-server-traffic-inspector"
version = "1.3.0"
description = "专为 AI Agent 打造的网络流量抓包、会话检索、链路质量诊断、请求重放与规则 Mock 的全功能 MCP Server"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Ateng" }
]
requires-python = ">=3.11"
keywords = [
    "mcp",
    "model-context-protocol",
    "traffic-inspector",
    "packet-sniffer",
    "mitmproxy",
    "tshark",
    "pcap",
    "network-diagnostics"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "mcp>=1.2.0",
    "mitmproxy>=11.0.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.7.0",
    "psutil>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/atengk/mcp-server-traffic-inspector"
Repository = "https://github.com/atengk/mcp-server-traffic-inspector.git"
Issues = "https://github.com/atengk/mcp-server-traffic-inspector/issues"
Documentation = "https://github.com/atengk/mcp-server-traffic-inspector#readme"
PyPI = "https://pypi.org/project/atengk-mcp-server-traffic-inspector/"

[project.scripts]
mcp-server-traffic-inspector = "mcp_server_traffic_inspector.__main__:main"
atengk-mcp-server-traffic-inspector = "mcp_server_traffic_inspector.__main__:main"

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_traffic_inspector"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
