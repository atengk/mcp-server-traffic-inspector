# ==============================================================================
# 工作流：Python 统合发版编排流水线 (Python Unified Release Orchestrator)
# 适用场景：mcp-server-traffic-inspector 的一键多渠道自动化统合发版
# 架构规范：参考 oss-template 标准二元模型（Dual-Workflow Standard）落地
# 触发通道：
#   - 网页手动触发 (workflow_dispatch)：在 Actions 界面输入版本号 (如 v1.0.0)，
#     自动校验语义化格式、主干分支、远端标签唯一性后创建 Git Tag 并推送发版
#   - 标签推送 (push tags: v*)：本地执行 git tag v1.0.0 && git push origin v1.0.0
# 核心特性：
#   - 严格分支与语义化 SemVer 双重防呆校验
#   - 单次构建原则 (Single Build)：一次编译不可变分发制品 (sdist *.tar.gz 与 wheel *.whl) 与 SHA-256 校验和
#   - 三核并行分发 (Fan-Out Delivery)：
#     1. GitHub Release 自动化发版 (集成 git-cliff 提取版本变更日志并挂载附件)
#     2. PyPI 官方中心仓库发布 (支持 Trusted Publishing OIDC 免密认证与 API Token 双轨兼容)
#     3. GHCR 多架构容器镜像 (docker buildx 构建 linux/amd64 与 linux/arm64 镜像并推送)
#   - 结构化发版看板：汇总各渠道交付状态并在 GitHub Step Summary 直出富文本报告
# ==============================================================================

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (必须以 v 开头，符合 SemVer 规范，如 v1.0.0 或 v1.0.0-rc.1)'
        required: true
        type: string

# 并发控制：发版流水线单例排队执行，严禁取消执行中的任务以保障版本与制品原子性
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: 预检防呆、单次打包构建与生成不可变制品校验和
  # ----------------------------------------------------------------------------
  build-artifacts:
    name: 编译制品与生成校验和
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # workflow_dispatch 模式下推送 Git Tag 所需权限
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      raw_version: ${{ steps.meta.outputs.raw_version }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      has_dockerfile: ${{ steps.meta.outputs.has_dockerfile }}

    steps:
      - name: 检出源码 (全量历史供日志生成)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: 解析与校验发版版本号 (Resolve & Validate Release Version)
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CURRENT_REF="${{ github.ref_name }}"
            DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
            if [ -n "$DEFAULT_BRANCH" ] && [ "$CURRENT_REF" != "$DEFAULT_BRANCH" ]; then
              echo "::error::禁止在非默认主干分支 [$CURRENT_REF] 触发发版！默认主干为 [$DEFAULT_BRANCH]，请切换至主干分支后重试。"
              exit 1
            elif [ -z "$DEFAULT_BRANCH" ] && [ "$CURRENT_REF" != "main" ] && [ "$CURRENT_REF" != "master" ]; then
              echo "::error::禁止在非主干分支 [$CURRENT_REF] 触发发版！仅允许在 main 或 master 分支发版。"
              exit 1
            fi

            TAG_NAME="${{ inputs.version }}"
            if [[ "$TAG_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
              TAG_NAME="v$TAG_NAME"
            fi
            if ! echo "$TAG_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
              echo "::error::版本号 [$TAG_NAME] 不符合语义化版本规范！必须形如 v1.0.0 或 v1.0.0-rc.1"
              exit 1
            fi
            if git ls-remote --tags origin "refs/tags/$TAG_NAME" | grep -q "$TAG_NAME"; then
              echo "::error::远程仓库已存在相同标签 [$TAG_NAME]，禁止重复发版！"
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
            git push origin "$TAG_NAME"
            echo "已由 GitHub Actions 显式创建并推送标签: $TAG_NAME"
          else
            TAG_NAME="${{ github.ref_name }}"
            if ! echo "$TAG_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
              echo "::error::推送的标签 [$TAG_NAME] 不符合语义化版本规范！必须形如 v1.0.0 或 v1.0.0-rc.1，已安全终止发版流水线。"
              exit 1
            fi
          fi

          RAW_VERSION="${TAG_NAME#v}"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "raw_version=$RAW_VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$TAG_NAME" =~ - ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "has_dockerfile=$(test -f Dockerfile && echo 'true' || echo 'false')" >> "$GITHUB_OUTPUT"

      - name: 安装 uv 并设置 Python 环境
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: '3.12'

      - name: 编译打包不可变发行制品并生成 SHA-256 校验和 (sdist & wheel)
        run: |
          mkdir -p dist
          uv build --out-dir dist/
          cd dist
          for file in *; do
            if [ -f "$file" ] && [ "$file" != "checksums.txt" ]; then
              sha256sum "$file"
            fi
          done > checksums.txt
          if [ -s checksums.txt ]; then
            echo "=== 构建产物校验和清单 ==="
            cat checksums.txt
          fi

      - name: 归档不可变制品附件
        uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: dist/*
          retention-days: 1

  # ----------------------------------------------------------------------------
  # Job 2: 发布 GitHub Release 与挂载不可变制品
  # ----------------------------------------------------------------------------
  publish-release:
    name: 发布 GitHub Release
    runs-on: ubuntu-latest
    needs: [build-artifacts]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 检出源码 (全量历史供日志生成)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 下载构建制品
        uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist

      - name: 生成发布日志 (基于 Commit 与 PR)
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: ${{ hashFiles('.cliff.toml') != '' && '.cliff.toml' || '' }}
          args: --tag ${{ needs.build-artifacts.outputs.tag_name }} --latest --strip header --github-repo ${{ github.repository }}
        env:
          OUTPUT: CHANGELOG_RELEASE.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 创建 GitHub Release 并挂载发布附件
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build-artifacts.outputs.tag_name }}
          name: ${{ needs.build-artifacts.outputs.tag_name }}
          body: ${{ steps.git-cliff.outputs.content }}
          draft: false
          prerelease: ${{ needs.build-artifacts.outputs.is_prerelease == 'true' }}
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ----------------------------------------------------------------------------
  # Job 3: 发布发行包至 PyPI 官方中心仓库 (OIDC 免密认证 / Token 双轨兼容)
  # ----------------------------------------------------------------------------
  publish-pypi:
    name: 发布至 PyPI 官方源
    runs-on: ubuntu-latest
    needs: [build-artifacts]
    if: vars.ENABLE_PYPI_PUBLISH != 'false'
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # PyPI Trusted Publishing (OIDC) 免密钥认证核心权限
    steps:
      - name: 下载构建制品
        uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist

      - name: 移除校验清单 (仅保留 wheel 与 tar.gz 上传 PyPI)
        run: rm -f dist/checksums.txt

      - name: 发布发行包至 PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  # ----------------------------------------------------------------------------
  # Job 4: 构建多架构 Docker 容器镜像并推送至 GHCR
  # ----------------------------------------------------------------------------
  publish-docker:
    name: 构建并推送 Docker 镜像 (GHCR)
    runs-on: ubuntu-latest
    needs: [build-artifacts]
    if: needs.build-artifacts.outputs.has_dockerfile == 'true'
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: 转换仓库名称为全小写
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: 检出源码
        uses: actions/checkout@v7

      - name: 设置 QEMU 模拟器 (多架构支持)
        uses: docker/setup-qemu-action@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取 Docker 镜像元数据与标签
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ env.REPO_LC }}
          flavor: |
            latest=${{ needs.build-artifacts.outputs.is_prerelease != 'true' }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.build-artifacts.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.build-artifacts.outputs.tag_name }}
            type=sha,format=short

      - name: 构建并推送多架构镜像 (amd64 / arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # Job 5: 输出统合发版全景看板摘要报告
  # ----------------------------------------------------------------------------
  summary:
    name: 输出发版看板报告
    runs-on: ubuntu-latest
    needs: [build-artifacts, publish-release, publish-pypi, publish-docker]
    if: always()
    timeout-minutes: 5
    steps:
      - name: 生成富文本发版全景看板
        run: |
          TAG="${{ needs.build-artifacts.outputs.tag_name }}"
          REPO_LC="${GITHUB_REPOSITORY,,}"
          {
            echo "## 🚀 Python 统合发版全景看板"
            echo ""
            echo "| 发版维度 | 状态 | 详细信息 |"
            echo "| :--- | :---: | :--- |"
            echo "| **发版版本** | \`$TAG\` | ${{ needs.build-artifacts.outputs.is_prerelease == 'true' && '🧪 Pre-release' || '🎉 稳定正式版' }} |"
            echo "| **GitHub Release** | ${{ needs.publish-release.result == 'success' && '✅ 成功' || '❌ 失败' }} | 更新日志已挂载不可变构建附件与校验和 |"
            echo "| **PyPI 官方分发** | ${{ needs.publish-pypi.result == 'success' && '✅ 成功' || (needs.publish-pypi.result == 'skipped' && '⚡ 已跳过' || '❌ 失败') }} | OIDC 免密 / API Token 分发至 pypi.org |"
            echo "| **GHCR 容器镜像** | ${{ needs.publish-docker.result == 'success' && '✅ 成功' || (needs.publish-docker.result == 'skipped' && '⚡ 已跳过 (无 Dockerfile)' || '❌ 失败') }} | 多架构 \`linux/amd64,arm64\` 镜像已构建推送 |"
            echo ""
            echo "### 📦 快速拉取与验证指引"
            echo '```bash'
            echo "# 使用 uvx 免安装直接拉起当前版本"
            echo "uvx --from ${GITHUB_REPOSITORY#*/}==${TAG#v} mcp-server-traffic-inspector --check"
            echo ""
            echo "# Docker 镜像拉取"
            echo "docker pull ghcr.io/${REPO_LC}:${TAG#v}"
            if [ "${{ needs.build-artifacts.outputs.is_prerelease }}" != "true" ]; then
              echo "docker pull ghcr.io/${REPO_LC}:latest"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
